name: Gerar instaladores

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixar PHP para Windows
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\php.zip"
          Invoke-WebRequest -Uri "https://windows.php.net/downloads/releases/latest/php-8.3-nts-Win32-vs16-x64-latest.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath desktop\php -Force
          Copy-Item C:\Windows\System32\vcruntime140.dll desktop\php\ -ErrorAction SilentlyContinue
          Copy-Item C:\Windows\System32\vcruntime140_1.dll desktop\php\ -ErrorAction SilentlyContinue
          Copy-Item C:\Windows\System32\msvcp140.dll desktop\php\ -ErrorAction SilentlyContinue
          @(
            'extension=curl',
            'extension=openssl',
            'extension=zip',
            'extension=mbstring',
            'extension=fileinfo',
            'memory_limit=512M',
            'upload_max_filesize=2G',
            'post_max_size=2G',
            'max_file_uploads=50',
            'max_execution_time=0',
            'display_errors=0',
            'log_errors=1',
            'date.timezone=America/Sao_Paulo'
          ) | Set-Content -Path desktop\php\php.ini -Encoding ascii
          & desktop\php\php.exe -c desktop\php\php.ini -d "extension_dir=$PWD\desktop\php\ext" -m

      - name: Montar instalador
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ComicStream-Windows
          path: desktop/dist/*.exe

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: android-actions/setup-android@v3

      - name: Preparar app
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node build-www.mjs
          npx cap sync android

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ComicStream.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ComicStream-Android
          path: mobile/ComicStream.apk
