<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ComicStream</title>
<style>
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; background: #fff4d6 radial-gradient(rgba(20,20,20,.11) 1.3px, transparent 1.7px) 0 0 / 15px 15px; font-family: Impact, 'Arial Black', sans-serif; }
.wrap { filter: drop-shadow(3px 0 0 #141414) drop-shadow(-3px 0 0 #141414) drop-shadow(0 3px 0 #141414) drop-shadow(0 -3px 0 #141414) drop-shadow(6px 6px 0 #141414); }
.burst { width: 240px; aspect-ratio: 1; display: grid; place-items: center; background: #ffd60a; color: #ff3d3d; font-size: 2.2rem; letter-spacing: .04em; -webkit-text-stroke: 1.2px #141414; clip-path: polygon(50% 0%, 58% 14.9%, 71.7% 5%, 72.4% 21.9%, 89.1% 18.8%, 82.4% 34.4%, 98.7% 38.9%, 86% 50%, 98.7% 61.1%, 82.4% 65.6%, 89.1% 81.2%, 72.4% 78.1%, 71.7% 95%, 58% 85.1%, 50% 100%, 42% 85.1%, 28.3% 95%, 27.6% 78.1%, 10.9% 81.2%, 17.6% 65.6%, 1.3% 61.1%, 14% 50%, 1.3% 38.9%, 17.6% 34.4%, 10.9% 18.8%, 27.6% 21.9%, 28.3% 5%, 42% 14.9%); animation: wobble 1.6s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg) scale(1.05); } }
</style>
</head>
<body>
<div class="wrap"><div class="burst">ComicStream!</div></div>
</body>
</html>
